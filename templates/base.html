<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Perpustakaan{% endblock %}</title>

    <!-- Script Pengecekan Tema Tersimpan (Mencegah Layar Berkedip Putih) -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',   /* Biru */
                        secondary: '#8b5cf6', /* Ungu */
                    }
                }
            }
        }

        // Fungsi Toggle Mode Gelap / Terang Permanen
        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen">

    <!-- Flash Messages (Notifikasi Sementara) -->
    <div class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-sm">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold text-white transition-all transform animate-bounce
                        {% if category == 'success' %} bg-green-500
                        {% elif category == 'error' %} bg-red-500
                        {% elif category == 'warning' %} bg-orange-500
                        {% else %} bg-blue-500 {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Tombol Dark Mode Melayang -->
    <button onclick="toggleDarkMode()" aria-label="Toggle Dark Mode" class="fixed bottom-6 right-6 p-3.5 bg-gradient-to-r from-primary to-secondary text-white rounded-2xl shadow-xl hover:scale-110 active:scale-95 transition-all duration-200 z-50 flex items-center justify-center">
        <!-- Ikon Matahari & Bulan Bergantian -->
        <svg class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <svg class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
