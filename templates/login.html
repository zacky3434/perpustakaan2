{% extends "base.html" %}
{% block title %}Login - Perpustakaan{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100 dark:border-gray-700">
        <h2 class="text-3xl font-bold text-center text-primary dark:text-blue-400 mb-2">Selamat Datang</h2>
        <p class="text-center text-gray-500 dark:text-gray-400 mb-6">Masuk untuk mulai meminjam buku</p>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-secondary focus:border-transparent dark:bg-gray-700 dark:border-gray-600">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-secondary focus:border-transparent dark:bg-gray-700 dark:border-gray-600">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary text-white py-2 rounded-lg hover:opacity-90 transition font-semibold">
                Login
            </button>
        </form>
        <p class="mt-4 text-center text-sm">
            Belum punya akun? <a href="{{ url_for('register') }}" class="text-secondary hover:underline">Daftar di sini</a>
        </p>
    </div>
</div>
{% endblock %}
