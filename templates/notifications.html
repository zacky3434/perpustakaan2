{% extends "base.html" %}
{% block title %}Notifikasi Saya{% endblock %}
{% block content %}
{% include "navbar.html" %}

<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-8 border-b border-gray-200 dark:border-gray-700 pb-4">
        <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white">Kotak Masuk Notifikasi</h2>
    </div>

    <div class="space-y-4">
        {% for notif in notifications %}
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex gap-4 items-start {% if not notif.is_read %} border-l-4 border-l-primary {% endif %}">
            <div class="bg-blue-50 dark:bg-gray-700 text-primary p-3 rounded-full flex-shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            </div>
            <div>
                <p class="text-gray-800 dark:text-gray-200 font-medium">{{ notif.message }}</p>
                <p class="text-xs text-gray-400 mt-2">{{ notif.created_at }}</p>
            </div>
        </div>
        {% else %}
        <div class="text-center py-16 bg-white dark:bg-gray-800 rounded-2xl border border-dashed border-gray-300 dark:border-gray-700">
            <p class="text-gray-500 dark:text-gray-400">Tidak ada notifikasi baru.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
