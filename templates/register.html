{% extends "base.html" %}
{% block title %}Registrasi - Perpustakaan{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100 dark:border-gray-700">
        <h2 class="text-3xl font-bold text-center text-secondary dark:text-purple-400 mb-2">Buat Akun</h2>
        <p class="text-center text-gray-500 dark:text-gray-400 mb-6">Bergabung dengan perpustakaan kami</p>

        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
                <input type="text" name="full_name" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-secondary to-primary text-white py-2 rounded-lg hover:opacity-90 transition font-semibold">
                Daftar
            </button>
        </form>
        <p class="mt-4 text-center text-sm">
            Sudah punya akun? <a href="{{ url_for('login') }}" class="text-primary hover:underline">Login di sini</a>
        </p>
    </div>
</div>
{% endblock %}
